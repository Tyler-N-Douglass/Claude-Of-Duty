[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Hashed bundles are immutable; the entry HTML must never be cached or players
# get yesterday's build pointing at deleted chunks.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Single-page app: everything resolves to the entry point.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
